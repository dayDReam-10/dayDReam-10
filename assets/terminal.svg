<svg xmlns="http://www.w3.org/2000/svg" width="840" height="100" viewBox="0 0 840 100" role="img" aria-labelledby="title desc">
  <title id="title">dayDReam-10 terminal</title>
  <desc id="desc">Read the source. Follow the trace. Write it down.</desc>
  <rect width="840" height="100" rx="12" fill="#0d1117"/>
  <rect x=".5" y=".5" width="839" height="99" rx="12" fill="none" stroke="#30363d"/>
  <circle cx="22" cy="20" r="4" fill="#f97316"/>
  <circle cx="38" cy="20" r="4" fill="#58a6ff"/>
  <circle cx="54" cy="20" r="4" fill="#8b949e"/>
  <text x="75" y="24" fill="#8b949e" font-family="monospace" font-size="12">dayDReam-10 / notebook</text>
  <text x="22" y="66" fill="#f97316" font-family="monospace" font-size="19">$</text>
  <defs><clipPath id="typing"><rect x="47" y="40" width="760" height="35">
    <animate attributeName="width" values="0;640;640;0" keyTimes="0;.55;.94;1" dur="12s" repeatCount="indefinite"/>
  </rect></clipPath></defs>
  <text x="47" y="66" fill="#e6edf3" font-family="monospace" font-size="19" clip-path="url(#typing)">Read the source. Follow the trace. Write it down.</text>
  <rect x="47" y="48" width="9" height="22" fill="#58a6ff">
    <animate attributeName="x" values="47;687;687;47" keyTimes="0;.55;.94;1" dur="12s" repeatCount="indefinite"/>
